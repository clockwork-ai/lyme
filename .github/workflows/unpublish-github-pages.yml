# Removes the unused GitHub Pages site so the managed
# "pages build and deployment" workflow stops running on pushes to main.
# The live site is the Cloudflare Worker lyme-plumbing (lymeplumbing.co.uk).
# This file does not change wrangler, Worker routes, or site content.
name: Unpublish GitHub Pages

on:
  pull_request:
    paths:
      - .github/workflows/unpublish-github-pages.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/unpublish-github-pages.yml
  workflow_dispatch:

permissions:
  pages: write

concurrency:
  group: unpublish-github-pages
  cancel-in-progress: false

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - name: Remove the GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          python3 << 'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPO"]
          api = f"https://api.github.com/repos/{repo}/pages"

          def request(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(url, data=data, method=method)
              req.add_header("Authorization", f"Bearer {token}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              if body is not None:
                  req.add_header("Content-Type", "application/json")
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode()
                      print(f"{method} {url.replace('https://api.github.com', '')} -> {resp.status}")
                      if raw:
                          print(raw[:2000])
                      return resp.status, raw
              except urllib.error.HTTPError as error:
                  raw = error.read().decode()
                  print(f"{method} {url.replace('https://api.github.com', '')} -> {error.code}")
                  print(raw[:2000])
                  return error.code, raw

          def load_pages():
              status, raw = request("GET", api)
              if status == 404:
                  return "absent", None
              try:
                  payload = json.loads(raw) if raw else {}
              except json.JSONDecodeError:
                  payload = {}
              return "present", payload

          def branch_publishing_off(payload):
              if payload is None:
                  return True
              source = payload.get("source") or {}
              branch = source.get("branch") if isinstance(source, dict) else None
              # The managed pages-build-deployment workflow runs only while a
              # branch source is set. build_type workflow with no branch stops it.
              return payload.get("build_type") == "workflow" and not branch

          state, payload = load_pages()
          if state == "absent" or branch_publishing_off(payload):
              print("GitHub Pages branch publishing is already off.")
              raise SystemExit(0)

          original = {
              "build_type": payload.get("build_type"),
              "source": payload.get("source"),
          }

          for attempt in range(1, 7):
              status, _raw = request("DELETE", api)
              if status in (204, 404):
                  print("Deleted the GitHub Pages site.")
                  raise SystemExit(0)
              if status != 409:
                  break
              print(f"Pages has a build in progress. Retry {attempt} of 6.")
              time.sleep(15)

          status, _raw = request("PUT", api, {"build_type": "workflow"})
          state, payload = load_pages()
          if state == "absent" or branch_publishing_off(payload):
              print("GitHub Pages no longer publishes from a branch.")
              raise SystemExit(0)

          # Put the previous source back if the switch did not actually stop
          # branch publishing. A half-updated Pages config still builds main.
          if status == 200 and original.get("build_type") and original.get("source"):
              print("Branch source is still set. Restoring the previous Pages source.")
              request("PUT", api, original)

          print("GitHub Pages is still set to publish this repository from a branch.")
          if payload:
              print(json.dumps({
                  "build_type": payload.get("build_type"),
                  "source": payload.get("source"),
                  "html_url": payload.get("html_url"),
              }))
          print(
              "A repository admin needs to open Settings → Pages → "
              "Build and deployment and set Source to None."
          )
          raise SystemExit(1)
          PY
