"$schema" = "./node_modules/wrangler/config-schema.json"
# Cloudflare Worker with static assets.
# Dashboard: Workers & Pages > Create > Worker > Import a repository.
# Build command: none. Deploy command: npx wrangler deploy
# Do not change DNS, MX or Email Routing records from this file.
name = "lyme-plumbing"
main = "src/worker.js"
compatibility_date = "2026-10-27"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
html_handling = "auto-trailing-slash"
# A quote form POST is a navigation request. From compatibility date 2025-04-01
# those skip the Worker unless the route runs first. Other paths stay on the
# asset layer so public/_redirects, extensionless URLs and /404.html still apply.
run_worker_first = [ "/api/*" ]

# Email Sending. Variable name EMAIL is what the quote handler reads.
# destination_address locks every message to the address already verified
# as an Email Routing destination on lymeplumbing.co.uk.
[[send_email]]
name = "EMAIL"
destination_address = "lymeplumbingandheating@gmail.com"

# Workers AI. No API key. The binding name is AI, which the chat route reads.
# If this binding is missing, Ask Lyme stays hidden.
[ai]
binding = "AI"
remote = false

# Pull request builds run `npx wrangler preview`. That command stops if this
# block is missing. Previews do not inherit the bindings above. Assets and
# the compatibility date stay at the top level. The quote form refuses
# preview hostnames, so the email binding is not copied here. The chat can
# still answer on a preview, because Workers AI does not send mail.
[previews]
[previews.ai]
binding = "AI"
